<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- displays site properly based on user's device -->

    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

    <title>Frontend Mentor | Social links profile</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

</head>

<body>

    <div class="card">
        <img src="assets/images/avatar-jessica.jpeg" alt="Jessica Randall's avatar">
        <div class="profile-header">
            <h1>Jessica Randall</h1>
            <p class="location">London, United Kingdom</p>
        </div>
        <p class="bio">"Front-end developer and avid reader."</p>
        <ul class="links">
            <li class="link"><a href="#">GitHub</a></li>
            <li class="link"><a href="#">Frontend Mentor</a></li>
            <li class="link"><a href="#">LinkedIn</a></li>
            <li class="link"><a href="#">Twitter</a></li>
            <li class="link"><a href="#">Instagram</a></li>
        </ul>
    </div>

    <footer class="attribution">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
        Coded by <a href="#">Your Name Here</a>.
    </footer>
</body>

</html>
